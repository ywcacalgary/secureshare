    const SUPABASE_URL = '__SUPABASE_URL__';
    const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

    const sb = window.supabase.createClient(

      SUPABASE_ANON_KEY

    const escapeHtml = (text) =>
      String(text ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

    function randomToken() {
      const bytes = crypto.getRandomValues(new Uint8Array(32));

      return Array.from(
        bytes,
        (byte) => byte.toString(16).padStart(2, '0')
      ).join('');
    }

    function randomKeyMaterial() {
      return crypto.getRandomValues(new Uint8Array(32));
    }

    function bytesToBase64(bytes) {
      let binary = '';

      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });

      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    async function sha256(text) {
      const buffer = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(text)
      );

      return Array.from(new Uint8Array(buffer))
        .map((byte) => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    async function deriveAesKey(rawKeyBytes) {
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        rawKeyBytes,
        'PBKDF2',
        false,
        ['deriveKey']
      );

      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: new TextEncoder().encode('secure-share-salt'),
          iterations: 100000,
          hash: 'SHA-256'
        },
        keyMaterial,
        {
          name: 'AES-GCM',
          length: 256
        },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptSecret(secretText) {
      const rawKey = randomKeyMaterial();
      const key = await deriveAesKey(rawKey);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(secretText);

      const cipherBuffer = await crypto.subtle.encrypt(
        {
          name: 'AES-GCM',
          iv
        },
        key,
        encoded
      );

      return {
        ciphertext: bytesToBase64(new Uint8Array(cipherBuffer)),
        iv: bytesToBase64(iv),
        key: bytesToBase64(rawKey)
      };
    }

    async function decryptSecret(ciphertextB64, ivB64, keyB64) {
      const rawKey = base64ToBytes(keyB64);
      const key = await deriveAesKey(rawKey);
      const iv = base64ToBytes(ivB64);
      const cipherBytes = base64ToBytes(ciphertextB64);

      const plainBuffer = await crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv
        },
        key,
        cipherBytes
      );

      return new TextDecoder().decode(plainBuffer);
    }

    function formatRemaining(milliseconds) {
      if (milliseconds <= 0) return 'Expired';

      const total = Math.floor(milliseconds / 1000);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;

      if (days > 0) return `${days}d ${hours}h`;
      if (hours > 0) return `${hours}h ${minutes}m`;
      if (minutes > 0) return `${minutes}m ${seconds}s`;

      return `${seconds}s`;
    }

    async function createSecret(secretText, label, expiresInMinutes) {
      const token = randomToken();
      const tokenHash = await sha256(token);
      const encrypted = await encryptSecret(secretText);

      const expiresAt = new Date(
        Date.now() + expiresInMinutes * 60 * 1000
      ).toISOString();

      const now = new Date().toISOString();

      const { error } = await sb.from('secrets').insert([
        {
          token_hash: tokenHash,
          label,
          ciphertext: encrypted.ciphertext,
          iv: encrypted.iv,
          expires_at: expiresAt,
          viewed: false,
          created_at: now,
          updated_at: now,
          access_count: 0,
          last_accessed_at: null
        }
      ]);

      if (error) throw error;

      const shareUrl =
        `${location.origin}${location.pathname}` +
        `?token=${encodeURIComponent(token)}` +
        `#k=${encodeURIComponent(encrypted.key)}`;

      return {
        token,
        shareUrl,
        key: encrypted.key
      };
    }

    async function loadSecretByToken(token) {
      const tokenHash = await sha256(token);

      const { data, error } = await sb
        .from('secrets')
        .select('*')
        .eq('token_hash', tokenHash)
        .single();

      if (error) throw error;

      return data;
    }

    async function markViewedByToken(token, currentAccessCount = 0) {
      const tokenHash = await sha256(token);
      const now = new Date().toISOString();

      const { error } = await sb
        .from('secrets')
        .update({
          viewed: true,
          viewed_at: now,
          last_accessed_at: now,
          access_count: currentAccessCount + 1,
          updated_at: now
        })
        .eq('token_hash', tokenHash);

      if (error) throw error;
    }

      );

      window.location.href =
        `mailto:?subject=${subject}&body=${body}`;
    }

      const secretInput = document.getElementById('secretInput');

      function setBadge(text, kind = 'neutral') {
        const classes = {
          neutral: 'bg-slate-800 text-slate-300',
          success: 'border border-emerald-500/20 bg-emerald-500/15 text-emerald-300',
          warn: 'border border-amber-500/20 bg-amber-500/15 text-amber-300',
          danger: 'border border-rose-500/20 bg-rose-500/15 text-rose-300'
        };

        statusBadge.className =
          `rounded-full px-2.5 py-1 text-xs ${classes[kind]}`;

        statusBadge.textContent = text;
      }

      function renderQr(url) {
        qrBox.innerHTML = '';

        const size = Math.floor(
          Math.min(qrBox.clientWidth, qrBox.clientHeight)
        );

        const qrWrapper = document.createElement('div');
        qrWrapper.className = 'h-full w-full';

        qrBox.appendChild(qrWrapper);

        new QRCode(qrWrapper, {
          text: url,
          width: size,
          height: size,
          colorDark: '#0f172a',
          colorLight: '#ffffff'
        });

        const qrVisual = qrWrapper.querySelector('canvas, img');

        if (qrVisual) {
          qrVisual.classList.add(
            'block',
            'h-full',
            'w-full',
            'max-h-full',
            'max-w-full'
          );

          qrVisual.style.width = '100%';
          qrVisual.style.height = '100%';
        }

        const logo = document.createElement('img');

        logo.src = 'assets/YWCA_icon_plum.png';
        logo.alt = 'YWCA SecureShare';

        logo.className = `
          absolute
          left-1/2
          top-1/2
          z-10
          h-1/4
          w-1/4
          -translate-x-1/2
          -translate-y-1/2
          rounded-xl
          bg-white
          p-0
          object-contain
          shadow-2xl
          ring-4
          ring-white
          drop-shadow-[0_4px_8px_rgba(0,0,0,0.55)]
        `;

        qrBox.appendChild(logo);
      }

      function focusResultSection() {
        resultSection?.classList.add('fade-slide-in');

        resultSection?.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

        resultSection?.focus({
          preventScroll: true
        });
      }

      createBtn.addEventListener('click', async () => {
        const text = secretInput.value.trim();

        if (!text) {
          return alert('Please enter a secret first.');
        }

        createBtn.disabled = true;
        createBtn.textContent = 'Generating...';

        try {
          const minutes = Number(expirySelect.value);

          const { shareUrl } = await createSecret(
            text,
            labelInput.value.trim(),
            minutes
          );

          shareLink.value = shareUrl;
          renderQr(shareUrl);
          setBadge('Ready', 'success');
          focusResultSection();
        } catch (error) {
          alert(error.message || 'Failed to create secret');
          setBadge('Error', 'danger');
        } finally {
          createBtn.disabled = false;
          createBtn.textContent = 'Generate secure link';
        }
      });

      clearBtn.addEventListener('click', () => {
        secretInput.value = '';
        labelInput.value = '';
        expirySelect.value = '1440';
        shareLink.value = '';

        qrBox.innerHTML = `
          <div class="absolute inset-0 flex items-center justify-center text-sm text-slate-500">
            QR code will appear here

        setBadge('Waiting', 'neutral');

      copyBtn.addEventListener('click', async () => {
        if (!shareLink.value) return;

        await navigator.clipboard.writeText(shareLink.value);

        const oldText = copyBtn.textContent;
        copyBtn.textContent = 'Copied';

        setTimeout(() => {
          copyBtn.textContent = oldText;
        }, 1200);
      });

      emailBtn.addEventListener('click', () => {
        if (!shareLink.value) return;

        openEmailShare(shareLink.value);
      });
    }

    function renderRecipient(record, token, key) {
      const remaining = record?.expires_at
        ? new Date(record.expires_at).getTime() - Date.now()
        : 0;

      if (!record) {
        app.innerHTML = `
          <div class="flex min-h-screen items-center justify-center px-4">
            <div class="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl fade-slide-in">
              <div class="mx-auto flex size-14 items-center justify-center rounded-full bg-rose-500/15 text-2xl text-rose-300">
                !
              </div>

              <h1 class="mt-5 text-3xl font-bold">
                Secret unavailable
              </h1>

              <p class="mt-3 text-slate-400">
                This link has already been used or no longer exists.
              </p>
            </div>
          </div>
        `;

        return;
      }

      if (remaining <= 0) {
        app.innerHTML = `
          <div class="flex min-h-screen items-center justify-center px-4">
            <div class="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl fade-slide-in">
              <div class="mx-auto flex size-14 items-center justify-center rounded-full bg-amber-500/15 text-2xl text-amber-300">
                ⏳
              </div>

              <h1 class="mt-5 text-3xl font-bold">
                Link expired
              </h1>

              <p class="mt-3 text-slate-400">
                This secret is no longer available.
              </p>
            </div>
          </div>
        `;

        return;
      }

      if (record.viewed) {
        app.innerHTML = `
          <div class="flex min-h-screen items-center justify-center px-4 py-8">
            <div class="w-full max-w-2xl rounded-3xl border border-slate-800 bg-slate-900/90 p-6 text-center shadow-2xl fade-slide-in md:p-8">
              <div class="inline-flex items-center gap-2 rounded-full bg-slate-500/15 px-4 py-2 text-sm font-medium text-slate-300">
                Already revealed
              </div>

              <h1 class="mt-5 text-3xl font-bold md:text-4xl">
                Secret already viewed
              </h1>

              <p class="mt-3 text-slate-400">
                This secret was already opened and cannot be revealed again.
              </p>
            </div>
          </div>
        `;

        return;
      }

      app.innerHTML = `
        <div class="flex min-h-screen items-center justify-center px-4 py-8">
          <div class="w-full max-w-2xl rounded-3xl border border-slate-800 bg-slate-900/90 p-6 shadow-2xl md:p-8">
            <div class="text-center">
              <div class="inline-flex items-center gap-2 rounded-full bg-cyan-500/15 px-4 py-2 text-sm font-medium text-cyan-300">
                One-time secret
              </div>

              <h1 class="mt-5 text-3xl font-bold md:text-4xl">
                Reveal the credential
              </h1>

              <p class="mt-3 text-slate-400">
                Click once to view the secret. After that, it cannot be viewed again.
              </p>
            </div>

            <div class="mt-8 grid grid-cols-1 gap-4 md:grid-cols-2">
              <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-5">
                <div class="text-xs uppercase tracking-wide text-slate-500">
                  Recipient label
                </div>

                <div class="mt-2 font-medium text-slate-200">
                  ${record.label ? escapeHtml(record.label) : 'Private secret'}
                </div>
              </div>

              <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-5">
                <div class="text-xs uppercase tracking-wide text-slate-500">
                  Expires in
                </div>

                <div id="countdown" class="mt-2 font-medium text-slate-200">
                  ${formatRemaining(remaining)}
                </div>
              </div>
            </div>

            <div id="revealWrap" class="mt-5 rounded-2xl border border-slate-800 bg-slate-950/70 p-5">
              <button
                id="revealBtn"
                type="button"
                class="w-full cursor-pointer rounded-2xl bg-emerald-500 px-5 py-4 font-semibold text-slate-950 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-300"
              >
                Reveal once
              </button>
            </div>

            <div id="resultArea" class="mt-5 hidden"></div>

            <div class="mt-6 text-sm text-slate-400">
              This secret will be marked as used after reveal.
            </div>
          </div>
        </div>
      `;

      const countdownEl = document.getElementById('countdown');
      const revealBtn = document.getElementById('revealBtn');
      const resultArea = document.getElementById('resultArea');

      const countdownTimer = setInterval(async () => {
        const fresh = await loadSecretByToken(token).catch(() => null);

        if (!fresh) {
          clearInterval(countdownTimer);
          location.reload();
          return;
        }

        const left =
          new Date(fresh.expires_at).getTime() - Date.now();

        if (left <= 0) {
          clearInterval(countdownTimer);
          location.reload();
          return;
        }

        countdownEl.textContent = formatRemaining(left);
      }, 1000);

      revealBtn.addEventListener('click', async () => {
        try {
          const fresh = await loadSecretByToken(token);

          if (
            !fresh ||
            fresh.viewed ||
            new Date(fresh.expires_at).getTime() <= Date.now()
          ) {
            clearInterval(countdownTimer);

            resultArea.classList.remove('hidden');

            resultArea.innerHTML = `
              <div class="rounded-2xl border border-rose-500/20 bg-rose-500/10 p-5 text-rose-300 fade-slide-in">
                This secret has already been revealed or expired.
              </div>
            `;

            document.getElementById('revealWrap')?.remove();

            return;
          }

          const plain = await decryptSecret(
            fresh.ciphertext,
            fresh.iv,
            key
          );

          await markViewedByToken(
            token,
            fresh.access_count || 0
          );

          clearInterval(countdownTimer);
          document.getElementById('revealWrap')?.remove();
          revealBtn.remove();

          resultArea.classList.remove('hidden');

          resultArea.innerHTML = `
            <div class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-5 transition-all duration-300 fade-slide-in">
              <div class="mb-3 flex items-center justify-between gap-3">
                <div class="text-sm font-medium text-emerald-300">
                  Secret revealed
                </div>

                <button
                  id="copySecretBtn"
                  type="button"
                  class="cursor-pointer rounded-xl bg-slate-800 px-3 py-2 text-xs font-medium text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-300"
                >
                  Copy
                </button>
              </div>

              <pre
                id="secretValue"
                class="whitespace-pre-wrap break-words font-mono text-sm leading-6 text-slate-100 soft-blur"
              >${escapeHtml(plain)}</pre>
            </div>
          `;

          const secretValue = document.getElementById('secretValue');

          setTimeout(() => {
            secretValue?.classList.remove('soft-blur');
          }, 120);

          const copySecretBtn =
            document.getElementById('copySecretBtn');

          copySecretBtn.addEventListener('click', async () => {
            await navigator.clipboard.writeText(plain);

            const oldText = copySecretBtn.textContent;
            copySecretBtn.textContent = 'Copied';

            setTimeout(() => {
              copySecretBtn.textContent = oldText;
            }, 1200);
          });
        } catch (error) {
          clearInterval(countdownTimer);

          resultArea.classList.remove('hidden');

          resultArea.innerHTML = `
            <div class="rounded-2xl border border-rose-500/20 bg-rose-500/10 p-5 text-rose-300 fade-slide-in">
              ${escapeHtml(error.message || 'Failed to reveal secret')}
            </div>
          `;

          document.getElementById('revealWrap')?.remove();
          revealBtn.remove();
        }
      });
    }

    (async function init() {
      if (
        !SUPABASE_URL ||
        !SUPABASE_ANON_KEY ||
        SUPABASE_URL.includes('YOUR_SUPABASE_URL') ||
        SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')
      ) {
        app.innerHTML = `
          <div class="p-8 text-red-300">
            Please set YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY in the HTML.
          </div>
        `;

        return;
      }

      if (tokenParam) {
        try {
          const tokenHash = await sha256(tokenParam);

          const { data, error } = await sb
            .from('secrets')
            .select('*')
            .eq('token_hash', tokenHash)
            .single();

          if (error) throw error;

          const key = new URLSearchParams(
            location.hash.replace(/^#/, '')
          ).get('k');

          if (!key) {
            throw new Error('Missing decryption key');
          }

          history.replaceState(
            null,
            '',
            location.pathname + location.search
          );

          renderRecipient(data, tokenParam, key);
        } catch (error) {
          renderRecipient(null, tokenParam, null);
        }
      } else {
        renderSender();
      }
    })();
  </script>
</body>
</html>
